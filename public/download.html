<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Genesis Order Relay App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-icon { font-size: 20px; margin-right: 8px; }
    .divider {
      border-top: 1px solid #334155;
      margin: 24px 0;
    }
    .steps {
      text-align: left;
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .steps h3 { font-size: 14px; color: #667eea; margin-bottom: 12px; }
    .step { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Genesis Order Relay</h1>
    <div class="subtitle">Download and install the app on your device</div>
    <a href="https://www.genesiszimbabwe.com/order-relay.html" class="btn btn-primary">Open Order Relay</a>
    <div class="divider"></div>
    <div class="steps">
      <h3>How to install</h3>
      <ol>
        <li>Click the button above</li>
        <li>Follow the on-screen instructions</li>
        <li>Install the app to your home screen</li>
      </ol>
    </div>
  </div>
</body>
</html>
